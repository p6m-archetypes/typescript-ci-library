name: Build

# One build per logical change (YP6M-3662): the pull_request run tests the MERGE ref — what
# main becomes — and the push run on main owns the release tail. Bare `pull_request:` would
# decode as an absent key to the standards suite, hence the explicit `{}`.
on:
  push:
    branches: [main]
  pull_request: {}
  # A manual release IS this pipeline at a chosen version level (YP6M-3663): dispatching with
  # minor/major runs the identical cut -> build -> image -> release -> dev-dispatch tail every
  # merge runs, so the release is promotable by construction. The tag-only cut-tag.yaml retired.
  workflow_dispatch:
    inputs:
      version-level:
        description: "Version bump level (merges always bump patch)"
        required: false
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  id-token: write

env:
  IMAGE_NAME: {{ project-name }}
  APPLICATION_NAME: {{ project-name }}
  
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: {% raw %}${{ steps.cut-patch.outputs.version }}{% endraw %}
      tag: {% raw %}${{ steps.cut-patch.outputs.tag }}{% endraw %}
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: p6m-actions/js-pnpm-setup@v1

      - name: Cut Version
        if: github.ref_name == 'main'
        id: cut-patch
        uses: p6m-actions/js-pnpm-cut-tag@v1
        with:
          version-level: {% raw %}${{ inputs.version-level || 'patch' }}{% endraw %}
          
      - name: Build
        uses: p6m-actions/js-pnpm-build@v1

  # Which platforms exist is the ORG's decision (YP6M-3779): P6M_IMAGE_PLATFORMS, an org-level
  # GitHub variable, defaults to both. Each platform builds on its NATIVE runner — never qemu:
  # emulated arm64 segfaults Node and runs compiled languages 10-50x slow (measured 2026-09-14
  # on the first retrofit tests). An org without arm runners sets the variable to linux/amd64.
  platforms:
    runs-on: ubuntu-latest
    outputs:
      matrix: {% raw %}${{ steps.resolve.outputs.matrix }}{% endraw %}
    steps:
      - name: Resolve platform matrix
        id: resolve
        run: |
          PLATFORMS="{% raw %}${{ vars.P6M_IMAGE_PLATFORMS || 'linux/amd64,linux/arm64' }}{% endraw %}"
          MATRIX=$(jq -cn --arg p "$PLATFORMS" '
            [{platform: "linux/amd64", arch: "amd64", runner: "ubuntu-latest"},
             {platform: "linux/arm64", arch: "arm64", runner: "ubuntu-24.04-arm"}]
            | map(select(. as $e | ($p | split(",") | map(gsub("\\s"; ""))) | index($e.platform)))')
          echo "Platforms: $PLATFORMS -> $MATRIX"
          if [ "$(echo "$MATRIX" | jq length)" = "0" ]; then
            echo "::error::P6M_IMAGE_PLATFORMS ('$PLATFORMS') selects no known platform"
            exit 1
          fi
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  image:
    name: {% raw %}Image (${{ matrix.platform }}){% endraw %}
    needs: [build, platforms]
    runs-on: {% raw %}${{ matrix.runner }}{% endraw %}
    strategy:
      fail-fast: false
      matrix:
        include: {% raw %}${{ fromJSON(needs.platforms.outputs.matrix) }}{% endraw %}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Artifactory Container Registry
        if: github.ref_name == 'main'
        uses: docker/login-action@v3
        with:
          registry: {% raw %}${{ vars.P6M_ARTIFACTORY_HOSTNAME }}{% endraw %}
          username: {% raw %}${{ secrets.P6M_ARTIFACTORY_USERNAME }}{% endraw %}
          password: {% raw %}${{ secrets.P6M_ARTIFACTORY_IDENTITY_TOKEN }}{% endraw %}

      # PR runs build (native, both platforms) without pushing; main pushes BY DIGEST — the
      # publish job assembles the digests into one multi-arch manifest under the version tag.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .platform/docker/prd/Dockerfile
          platforms: {% raw %}${{ matrix.platform }}{% endraw %}
          outputs: {% raw %}type=image,name=${{ vars.P6M_ARTIFACTORY_HOSTNAME }}/${{ vars.P6M_ARTIFACTORY_PROJECT }}-docker-local/applications/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=${{ github.ref_name == 'main' }}{% endraw %}

      - name: Export digest
        if: github.ref_name == 'main'
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          echo "{% raw %}${{ steps.build.outputs.digest }}{% endraw %}" > "$RUNNER_TEMP/digests/digest-{% raw %}${{ matrix.arch }}{% endraw %}.txt"

      - name: Upload digest
        if: github.ref_name == 'main'
        uses: actions/upload-artifact@v4
        with:
          name: digests-{% raw %}${{ matrix.arch }}{% endraw %}
          path: {% raw %}${{ runner.temp }}{% endraw %}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    if: github.ref_name == 'main'
    needs: [build, image]
    runs-on: ubuntu-latest
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: {% raw %}${{ runner.temp }}{% endraw %}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Login to Artifactory Container Registry
        uses: docker/login-action@v3
        with:
          registry: {% raw %}${{ vars.P6M_ARTIFACTORY_HOSTNAME }}{% endraw %}
          username: {% raw %}${{ secrets.P6M_ARTIFACTORY_USERNAME }}{% endraw %}
          password: {% raw %}${{ secrets.P6M_ARTIFACTORY_IDENTITY_TOKEN }}{% endraw %}

      - name: Assemble the multi-arch manifest
        id: manifest
        run: |
          REPO="{% raw %}${{ vars.P6M_ARTIFACTORY_HOSTNAME }}/${{ vars.P6M_ARTIFACTORY_PROJECT }}-docker-local/applications/${{ env.IMAGE_NAME }}{% endraw %}"
          TAG="{% raw %}${{ needs.build.outputs.tag }}{% endraw %}"
          SOURCES=$(cat "$RUNNER_TEMP"/digests/digest-*.txt | xargs -n1 printf "${REPO}@%s ")
          docker buildx imagetools create -t "${REPO}:${TAG}" ${SOURCES}
          # The manifest list's digest IS the sha256 of its canonical bytes — computed from
          # --raw rather than a Go-template --format, whose double-brace syntax reads as an
          # unrendered template marker to both ATL and the standards suite.
          DIGEST="sha256:$(docker buildx imagetools inspect --raw "${REPO}:${TAG}" | sha256sum | cut -d' ' -f1)"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Multi-arch manifest: ${REPO}:${TAG} @ ${DIGEST}"

      - name: Make Artifacts
        run: |
          echo '{% raw %}${{ steps.manifest.outputs.digest }}{% endraw %}' | tee digest.txt

      - name: Create Github release
        uses: ncipollo/release-action@v1
        with:
          name: Version {% raw %}${{ needs.build.outputs.version }}{% endraw %}
          tag: {% raw %}${{ needs.build.outputs.tag }}{% endraw %}
          makeLatest: true
          artifacts: "digest.txt"
          removeArtifacts: true
          generateReleaseNotes: true
          body: |
            Application version: `{% raw %}${{ needs.build.outputs.version }}{% endraw %}`
            Docker image digest: `{% raw %}${{ steps.manifest.outputs.digest }}{% endraw %}`

      - name: Update Application Manifest
        uses: p6m-actions/platform-application-manifest-dispatch@v1
        with:
          repository: {% raw %}${{ github.repository }}{% endraw %}
          image-name: {% raw %}${{ env.IMAGE_NAME }}{% endraw %}
          environment: "dev"
          digest: {% raw %}${{ steps.manifest.outputs.digest }}{% endraw %}
          update-manifest-token: {% raw %}${{ secrets.P6M_UPDATE_MANIFEST_TOKEN }}{% endraw %}
          platform-dispatch-url: {% raw %}${{ vars.P6M_PLATFORM_DISPATCH_URL }}{% endraw %}
          directory-name: {% raw %}${{ env.APPLICATION_NAME }}{% endraw %}
