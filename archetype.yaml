---
description: "TypeScript CI Workflows — GitHub Actions build and release workflows for pnpm projects"
summary: >
  Generates .github/workflows/build.yaml (CI on push/PR) and
  .github/workflows/cut-tag.yaml (manual release tagging) for any
  TypeScript pnpm service archetype. Consumed as a library by service
  archetypes, or run standalone to retrofit an existing project.
authors: ["Jimmie Fulton <jimmie@ybor.ai>"]
tags: ["library", "typescript", "ci", "github-actions", "pnpm"]

requires:
  archetect: "3.0.0"

templating:
  trim_blocks: true
  lstrip_blocks: true
